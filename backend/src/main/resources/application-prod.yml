spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: app

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app
    default-schema: app

  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.0

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  datasource:
    readonly:
      url: ${APP_DATASOURCE_READONLY_URL}
      username: ${APP_DATASOURCE_READONLY_USERNAME}
      password: ${APP_DATASOURCE_READONLY_PASSWORD}
  query-execution:
    timeout-seconds: 5
    max-rows: 500
  jwt:
    # No insecure fallback here, unlike application-dev.yml - missing this
    # in a real environment should fail startup loudly, not silently sign
    # tokens with a dev secret.
    secret: ${APP_JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sqlgenie
    username: app_owner
    password: app_owner_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: app

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: app
    default-schema: app

  ai:
    openai:
      # Groq's API is OpenAI-compatible, so the OpenAI client is reused
      # here pointed at Groq's endpoint instead of api.openai.com - no
      # separate Spring AI provider integration exists (or is needed).
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:not-configured}
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.0

app:
  jwt:
    # Dev-only default. In every real environment this MUST come from an env var / Key Vault.
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-change-me-please-32bytes-min}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  admin:
    email: ${ADMIN_SEED_EMAIL:admin@sqlgenie.dev}
    password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}

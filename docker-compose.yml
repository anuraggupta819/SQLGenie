services:
  postgres:
    image: postgres:16-alpine
    container_name: sqlgenie-postgres
    environment:
      POSTGRES_DB: sqlgenie
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: app_owner_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d sqlgenie"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: sqlgenie-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sqlgenie
      SPRING_DATASOURCE_USERNAME: app_owner
      SPRING_DATASOURCE_PASSWORD: app_owner_password
      APP_DATASOURCE_READONLY_URL: jdbc:postgresql://postgres:5432/sqlgenie
      APP_DATASOURCE_READONLY_USERNAME: readonly_query_user
      APP_DATASOURCE_READONLY_PASSWORD: readonly_query_password
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-not-configured}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: sqlgenie-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:

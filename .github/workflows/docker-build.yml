name: Docker Build

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Smoke-test frontend is served
        run: |
          curl -sf http://localhost:5173/ | grep -qi "<title>SQLGenie</title>" \
            && echo "Frontend served correctly" \
            || (echo "Frontend did not serve expected content" && docker compose logs frontend && exit 1)

      - name: Smoke-test register endpoint end to end
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"docker-smoke-test@example.com","password":"Passw0rd!","fullName":"Docker Smoke Test"}')
          if [ "$STATUS" != "201" ]; then
            echo "Expected 201 from register, got $STATUS"
            docker compose logs backend
            exit 1
          fi
          echo "Register endpoint returned 201 as expected"

      - name: Tear down
        if: always()
        run: docker compose down -v
